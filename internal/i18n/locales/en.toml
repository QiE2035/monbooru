# Monbooru English translations.
# Keys are dot-separated `<page>_<area>_<purpose>` so the template call
# site is self-documenting (`{{ T "layout_topbar_images" }}`). Values
# are the verbatim existing UI strings so language = "en" is a no-op
# regression for every entry here.

