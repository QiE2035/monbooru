{{define "partials/implications_dialog.html"}}
<p>{{ T "implications_dialog.implied_by" (dict "parent" .Parent.Name) }}</p>
<ul class="tag-list">
  {{range .Implications}}
  <li class="tag-item" style="color:{{.ImpliedCategoryColor}}">
    <a href="/tags/{{.ImpliedID}}" class="tag-chip-name" title="{{ T "implications_dialog.tag_details_title" }}">{{.ImpliedName}}</a>
    <button class="tag-remove-btn"
            hx-delete="/tags/{{.ParentID}}/implications/{{.ImpliedID}}"
            hx-headers='{"X-CSRF-Token":"{{$.CSRFToken}}"}'
            hx-on::after-request="if(event.detail.successful){this.closest('li').remove();}"
            title="{{ T "implications_dialog.remove_implication_title" }}">×</button>
  </li>
  {{else}}
  <li class="no-tags">{{ T "implications_dialog.no_implications" }}</li>
  {{end}}
</ul>
<form id="implication-add-form" class="add-tag-form"
      hx-post="/tags/{{.Parent.ID}}/implications"
      hx-target="#implication-add-flash"
      hx-swap="innerHTML"
      hx-on::after-request="handleImplicationAdded(event)">
  <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
  <div class="add-tag-input-wrap">
    <input type="text" name="implied_id" id="implication-add-input"
           placeholder="{{ T "implications_dialog.imply_placeholder" }}" required autocomplete="off"
           data-multi-tags="1"
           hx-get="/internal/tags/suggest"
           hx-trigger="input changed delay:200ms"
           hx-target="#implication-add-suggest"
           hx-swap="innerHTML"
           hx-vals='js:{q: (document.getElementById("implication-add-input").value || "").split(/\s+/).pop()}'
           onkeydown="handleSuggestKey(event, 'implication-add-suggest', 'implication-add-input')">
    <div id="implication-add-suggest" class="suggest-dropdown tag-suggest-dropdown"></div>
  </div>
  <button type="submit" class="btn-sm">{{ T "implications_dialog.add_btn" }}</button>
</form>
<div id="implication-add-flash"></div>
{{end}}
