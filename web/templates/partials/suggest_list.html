{{define "partials/suggest_list.html"}}
{{if .Items}}
<div class="suggest-list">
  {{range .Items}}
  <button type="button" class="suggest-item"
          {{if .Color}}style="color:{{.Color}}"{{end}}
          {{$.Attr}}="{{.Name}}"
          {{$.OnClick}}>
    <span class="suggest-name">{{.Name}}</span>
    {{if .Description}}<span class="suggest-description">{{.Description}}</span>{{end}}
    {{if .ShowCount}}<span class="suggest-count">{{.UsageCount}}</span>{{end}}
  </button>
  {{end}}
</div>
{{end}}
{{end}}
