{{define "partials/series_suggest.html"}}
{{if .Series}}
<div class="suggest-list">
  {{range .Series}}
  <button type="button" class="suggest-item"
          data-series="{{.}}"
          onclick="applySeriesSuggest(this)">
    <span class="suggest-name">{{.}}</span>
  </button>
  {{end}}
</div>
{{end}}
{{end}}
