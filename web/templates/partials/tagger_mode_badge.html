{{define "partials/tagger_mode_badge.html"}}
{{$provider := .Provider}}
{{if eq $provider ""}}{{$provider = "cpu"}}{{end}}
{{$label := providerLabel $provider}}
<span id="tagger-mode-badge"{{if .OOB}} hx-swap-oob="true"{{end}}>
  {{if eq $provider "cpu"}}<span class="status-badge status-off" title="Auto-tagger runs on {{$label}}">{{$label}}</span>{{else}}<span class="status-badge status-ok" title="Auto-tagger runs on {{$label}}">{{$label}}</span>{{end}}
</span>
{{end}}
