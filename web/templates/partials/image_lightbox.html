{{define "partials/image_lightbox.html"}}
<dialog id="image-lightbox" class="lightbox-dialog" aria-label="{{ T "lightbox.aria_label" }}">
  <div class="lightbox-stage" id="lightbox-stage">
    <img id="lightbox-img" class="lightbox-img" alt="">
  </div>
  <div class="lightbox-bar">
    <button type="button" id="lightbox-close" title="{{ T "lightbox.close" }} (Esc)">× {{ T "lightbox.close" }}</button>
    <span class="lightbox-zoom" id="lightbox-zoom">100%</span>
    <a id="lightbox-open" class="lightbox-open" href="" target="_blank" rel="noopener" title="{{ T "lightbox.open_new_tab" }}">↗</a>
  </div>
</dialog>
{{end}}
